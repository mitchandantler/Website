<div class="rounded-lg border border-neutral-200 bg-white p-5">
  <div class="text-amber-500" aria-hidden="true">{{ review.stars }}</div>
  <span class="sr-only">{{ review.rating }} out of 5 stars</span>
  <p class="mt-2 text-neutral-700">&ldquo;{{ review.content }}&rdquo;</p>
  <p class="mt-3 text-sm font-medium text-neutral-900">
    {{ review.author_name }}
    {% if review.source %}<span class="font-normal text-neutral-500">via {{ review.source }}</span>{% endif %}
  </p>
</div>
