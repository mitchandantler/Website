<div class="overflow-hidden rounded-lg border border-charcoal/10 bg-cream">
  {% if promotion.image %}
    <img src="{{ promotion.image.url }}" alt="{{ promotion.title }}" class="h-40 w-full object-cover">
  {% endif %}
  <div class="p-4">
    <h3 class="font-semibold text-charcoal">{{ promotion.title }}</h3>
    {% if promotion.description %}
      <p class="mt-1 text-sm text-charcoal/70">{{ promotion.description }}</p>
    {% endif %}
    {% if promotion.end_date %}
      <p class="mt-2 inline-block rounded-full bg-brick/10 px-2 py-1 text-xs text-brick">Ends {{ promotion.end_date|date:"j M Y" }}</p>
    {% endif %}
  </div>
</div>
