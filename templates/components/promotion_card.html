<div class="overflow-hidden rounded-lg border border-neutral-200 bg-white">
  {% if promotion.image %}
    <img src="{{ promotion.image.url }}" alt="{{ promotion.title }}" class="h-40 w-full object-cover">
  {% endif %}
  <div class="p-4">
    <h3 class="font-semibold text-neutral-900">{{ promotion.title }}</h3>
    {% if promotion.description %}
      <p class="mt-1 text-sm text-neutral-600">{{ promotion.description }}</p>
    {% endif %}
    {% if promotion.end_date %}
      <p class="mt-2 text-xs text-neutral-500">Ends {{ promotion.end_date|date:"j M Y" }}</p>
    {% endif %}
  </div>
</div>
