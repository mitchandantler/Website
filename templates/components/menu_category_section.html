<ul class="divide-y divide-neutral-200">
  {% for item in category.items.all %}
    <li class="py-4">
      <div class="flex items-start justify-between gap-4">
        <div>
          <p class="font-medium text-neutral-900">{{ item.name }}</p>
          {% if item.description %}
            <p class="mt-1 text-sm text-neutral-600">{{ item.description }}</p>
          {% endif %}
          {% if item.dietary_tags.all %}
            <div class="mt-2 flex flex-wrap gap-1">
              {% for tag in item.dietary_tags.all %}
                <span class="inline-block rounded-full bg-neutral-100 px-2 py-0.5 text-xs text-neutral-600">{{ tag.name }}</span>
              {% endfor %}
            </div>
          {% endif %}
        </div>
        <p class="whitespace-nowrap font-medium text-neutral-900">${{ item.price }}</p>
      </div>
    </li>
  {% endfor %}
</ul>
